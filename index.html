
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--color-background-tertiary);color:var(--color-text-primary);font-size:14px}
.tabs{display:flex;background:var(--color-background-primary);border-bottom:0.5px solid var(--color-border-tertiary);padding:0 12px;position:sticky;top:0;z-index:10}
.tab{padding:12px 16px;background:none;border:none;border-bottom:2px solid transparent;font-family:inherit;font-size:13px;font-weight:500;color:var(--color-text-secondary);cursor:pointer;transition:all .15s;white-space:nowrap}
.tab.on{color:var(--color-text-primary);border-bottom-color:var(--color-text-primary)}
.tab:hover:not(.on){color:var(--color-text-primary)}
.page{display:none;padding:16px 14px 40px;max-width:680px;margin:0 auto}
.page.on{display:block}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:14px;margin-bottom:12px}
.lbl{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-secondary);margin-bottom:10px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--color-text-secondary);margin-bottom:4px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);margin-bottom:7px}
.em{font-size:18px;flex-shrink:0}
.nm{flex:1;font-weight:500;font-size:14px}
.bdg{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:var(--color-background-info);color:var(--color-text-info);margin-top:3px}
.del{background:none;border:none;cursor:pointer;color:var(--color-text-secondary);padding:4px 8px;border-radius:var(--border-radius-md);font-size:16px;transition:all .15s}
.del:hover{background:var(--color-background-danger);color:var(--color-text-danger)}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.nav-title{flex:1;text-align:center;font-size:15px;font-weight:500}
.cb{width:28px;height:28px;border:1.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .15s;background:var(--color-background-primary);user-select:none;flex-shrink:0}
.cb.on{background:var(--color-background-success);border-color:var(--color-border-success);color:var(--color-text-success)}
.ctrl{flex-shrink:0}
.ctrl input{width:120px;padding:6px 9px;font-size:13px}
.dur{display:flex;align-items:center;gap:5px}
.dur input{width:80px}
.dur span{font-size:12px;color:var(--color-text-secondary)}
.save-row{margin-top:14px;text-align:right}
.hist-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;flex-wrap:wrap}
.hist-period{font-size:13px;font-weight:500}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.dot{width:32px;height:32px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:500;border:0.5px solid transparent;line-height:1.2}
.dot-e{background:var(--color-background-tertiary);border-color:var(--color-border-tertiary);color:var(--color-text-secondary)}
.dot-g{background:var(--color-background-success);border-color:var(--color-border-success);color:var(--color-text-success)}
.dot-r{background:var(--color-background-danger);border-color:var(--color-border-danger);color:var(--color-text-danger)}
.dot-b{background:var(--color-background-info);border-color:var(--color-border-info);color:var(--color-text-info)}
.dot-day{font-size:8px;opacity:.7}
.dot-val{font-size:9px;font-weight:600}
.empty{text-align:center;padding:32px 16px;color:var(--color-text-secondary);font-size:13px}
.divider{border:none;border-top:0.5px solid var(--color-border-tertiary);margin:14px 0}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(50px);background:var(--color-text-primary);color:var(--color-background-primary);padding:8px 18px;border-radius:20px;font-size:12px;font-weight:500;transition:transform .22s;z-index:100;pointer-events:none;opacity:0}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
</style>

<div class="tabs">
  <button class="tab on" onclick="go('habits')">Привычки</button>
  <button class="tab" onclick="go('today')">Сегодня</button>
  <button class="tab" onclick="go('history')">История</button>
</div>

<div id="pg-habits" class="page on">
  <div class="card">
    <div class="lbl">Новая привычка</div>
    <div class="field"><label>Название</label><input id="nn" type="text" placeholder="Проснуться, шаги, учёба..."></div>
    <div class="fg">
      <div class="field"><label>Тип</label>
        <select id="nt">
          <option value="checkbox">Чекбокс (да/нет)</option>
          <option value="time">Время (во сколько)</option>
          <option value="number">Количество (число)</option>
          <option value="duration">Длительность (мин)</option>
          <option value="text">Текст / заметка</option>
        </select>
      </div>
      <div class="field"><label>Эмодзи</label><input id="ne" type="text" placeholder="🌅 💪 📚"></div>
    </div>
    <button class="btn" onclick="addHabit()" style="margin-top:2px">+ Добавить</button>
  </div>
  <div class="divider"></div>
  <div class="lbl">Мои привычки</div>
  <div id="habits-list"></div>
</div>

<div id="pg-today" class="page">
  <div class="nav">
    <button class="btn" onclick="chDay(-1)">←</button>
    <div class="nav-title" id="day-title"></div>
    <button class="btn" id="btn-fwd" onclick="chDay(1)">→</button>
  </div>
  <div id="track-list"></div>
  <div class="save-row"><button class="btn" onclick="saveDay()" style="background:var(--color-text-primary);color:var(--color-background-primary);border-color:var(--color-text-primary)">Сохранить</button></div>
</div>

<div id="pg-history" class="page">
  <div class="hist-hdr">
    <div class="hist-period" id="hist-lbl"></div>
    <div style="display:flex;gap:6px">
      <button class="btn" id="hprev" onclick="chHist(-1)">←</button>
      <button class="btn" id="hnext" onclick="chHist(1)">→</button>
    </div>
  </div>
  <div id="hist-list"></div>
</div>

<div class="toast" id="toast"></div>

<script>
let habits=[], logs={}, curDay='', histOff=0;

function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function shift(s,n){
  const [y,m,d]=s.split('-').map(Number);
  const dt=new Date(y,m-1,d);
  dt.setDate(dt.getDate()+n);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}

function fmtDay(s){
  const [y,m,d]=s.split('-').map(Number);
  const dt=new Date(y,m-1,d);
  const t=todayStr(), yest=shift(t,-1);
  const MO=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  const DA=['вс','пн','вт','ср','чт','пт','сб'];
  if(s===t) return 'Сегодня, '+d+' '+MO[m-1];
  if(s===yest) return 'Вчера, '+d+' '+MO[m-1];
  return DA[dt.getDay()]+' '+d+' '+MO[m-1];
}

function tlbl(t){return{checkbox:'Чекбокс',time:'Время',number:'Количество',duration:'Длительность',text:'Текст'}[t]||t}
function uid(){return 'h'+Date.now()+Math.random().toString(36).slice(2,6)}

function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('on');
  setTimeout(()=>el.classList.remove('on'),1800);
}

async function saveState(){
  try{
    await window.storage.set('habits',JSON.stringify(habits));
    await window.storage.set('logs',JSON.stringify(logs));
  }catch(e){}
}

async function loadState(){
  try{
    const h=await window.storage.get('habits');
    const l=await window.storage.get('logs');
    if(h) habits=JSON.parse(h.value);
    if(l) logs=JSON.parse(l.value);
  }catch(e){}
  if(!habits.length){
    habits=[
      {id:'h1',name:'Проснуться',type:'time',emoji:'🌅'},
      {id:'h2',name:'Шаги',type:'number',emoji:'👣'},
      {id:'h3',name:'Учёба',type:'duration',emoji:'📚'},
      {id:'h4',name:'Умыться',type:'checkbox',emoji:'🪥'},
    ];
    await saveState();
  }
}

function go(p){
  ['habits','today','history'].forEach(x=>{
    document.getElementById('pg-'+x).classList.toggle('on',x===p);
  });
  document.querySelectorAll('.tab').forEach((el,i)=>{
    el.classList.toggle('on',['habits','today','history'][i]===p);
  });
  if(p==='today') renderToday();
  if(p==='history'){histOff=0;renderHistory();}
}

function addHabit(){
  const name=document.getElementById('nn').value.trim();
  const type=document.getElementById('nt').value;
  const emoji=document.getElementById('ne').value.trim()||'⭐';
  if(!name){document.getElementById('nn').focus();return;}
  habits.push({id:uid(),name,type,emoji});
  document.getElementById('nn').value='';
  document.getElementById('ne').value='';
  saveState();
  renderHabits();
  showToast('Привычка добавлена');
}

function removeHabit(id){
  habits=habits.filter(h=>h.id!==id);
  saveState();
  renderHabits();
  renderToday();
  showToast('Удалено');
}

function renderHabits(){
  const el=document.getElementById('habits-list');
  if(!habits.length){el.innerHTML='<div class="empty">Добавь первую привычку выше</div>';return;}
  el.innerHTML=habits.map(h=>`
    <div class="row">
      <span class="em">${h.emoji}</span>
      <div style="flex:1;min-width:0">
        <div class="nm">${h.name}</div>
        <span class="bdg">${tlbl(h.type)}</span>
      </div>
      <button class="del" onclick="removeHabit('${h.id}')" title="Удалить">✕</button>
    </div>`).join('');
}

function chDay(n){
  const next=shift(curDay,n);
  if(next>todayStr()) return;
  curDay=next;
  renderToday();
}

function getLog(day){return logs[day]||{}}

function setVal(id,val){
  if(!logs[curDay]) logs[curDay]={};
  logs[curDay][id]=val;
  saveState();
}

function toggleCb(id){
  const cur=getLog(curDay)[id];
  setVal(id,!cur);
  const el=document.getElementById('cb-'+id);
  const on=!cur;
  el.className='cb'+(on?' on':'');
  el.textContent=on?'✓':'';
}

function renderToday(){
  const t=todayStr();
  document.getElementById('day-title').textContent=fmtDay(curDay);
  const btn=document.getElementById('btn-fwd');
  btn.disabled=(curDay>=t);
  btn.style.opacity=(curDay>=t)?'0.35':'1';
  btn.style.cursor=(curDay>=t)?'not-allowed':'pointer';

  const log=getLog(curDay);
  const el=document.getElementById('track-list');
  if(!habits.length){el.innerHTML='<div class="empty">Сначала добавь привычки</div>';return;}
  el.innerHTML=habits.map(h=>{
    const val=log[h.id];
    let ctrl='';
    if(h.type==='checkbox'){
      const on=val===true;
      ctrl=`<div class="cb${on?' on':''}" id="cb-${h.id}" onclick="toggleCb('${h.id}')">${on?'✓':''}</div>`;
    } else if(h.type==='time'){
      ctrl=`<input type="time" value="${val||''}" onchange="setVal('${h.id}',this.value)">`;
    } else if(h.type==='number'){
      ctrl=`<input type="number" placeholder="0" value="${val!==undefined?val:''}" min="0" oninput="setVal('${h.id}',parseFloat(this.value)||0)">`;
    } else if(h.type==='duration'){
      ctrl=`<div class="dur"><input type="number" placeholder="0" min="0" value="${val!==undefined?val:''}" oninput="setVal('${h.id}',parseFloat(this.value)||0)"><span>мин</span></div>`;
    } else if(h.type==='text'){
      ctrl=`<input type="text" placeholder="заметка" value="${val||''}" oninput="setVal('${h.id}',this.value)" style="width:140px">`;
    }
    return `<div class="row"><span class="em">${h.emoji}</span><span class="nm">${h.name}</span><div class="ctrl">${ctrl}</div></div>`;
  }).join('');
}

function saveDay(){saveState();showToast('Сохранено ✓');}

function getHistDays(){
  const days=[];
  for(let i=13;i>=0;i--) days.push(shift(todayStr(),-(histOff*14+i)));
  return days;
}

function chHist(dir){
  const next=histOff+dir;
  if(next<0) return;
  histOff=next;
  renderHistory();
}

function renderHistory(){
  const days=getHistDays();
  const MO=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  const DA=['вс','пн','вт','ср','чт','пт','сб'];
  const [,sm,sd]=days[0].split('-').map(Number);
  const [ey,em,ed]=days[13].split('-').map(Number);
  document.getElementById('hist-lbl').textContent=`${sd} ${MO[sm-1]} — ${ed} ${MO[em-1]} ${ey}`;
  document.getElementById('hnext').disabled=histOff===0;
  document.getElementById('hnext').style.opacity=histOff===0?'0.35':'1';

  const el=document.getElementById('hist-list');
  if(!habits.length){el.innerHTML='<div class="empty">Нет привычек</div>';return;}

  const t=todayStr();
  el.innerHTML=habits.map((h,hi)=>{
    const dots=days.map(day=>{
      const val=(logs[day]||{})[h.id];
      const [,dm,dd]=day.split('-').map(Number);
      const dt=new Date(...day.split('-').map((v,i)=>i===1?v-1:Number(v)));
      const lbl=`${dd}<br><span class="dot-day">${DA[dt.getDay()]}</span>`;
      if(h.type==='checkbox'){
        if(val===true) return `<div class="dot dot-g" title="${day}">✓<br>${lbl}</div>`;
        if(logs[day]!==undefined||day<t) return `<div class="dot dot-r" title="${day}">✗<br>${lbl}</div>`;
        return `<div class="dot dot-e">${lbl}</div>`;
      }
      if(val===undefined||val===null||val==='') return `<div class="dot dot-e">${lbl}</div>`;
      if(h.type==='number'||h.type==='duration'){
        const n=parseFloat(val);
        const disp=isNaN(n)?'?':(n>=1000?Math.round(n/100)/10+'к':n);
        return `<div class="dot dot-b" title="${day}: ${val}"><span class="dot-val">${disp}</span><br>${lbl}</div>`;
      }
      if(h.type==='time') return `<div class="dot dot-b" title="${day}: ${val}"><span class="dot-val" style="font-size:7px">${val}</span><br>${lbl}</div>`;
      return `<div class="dot dot-g" title="${day}: ${val}">✓<br>${lbl}</div>`;
    }).join('');
    return `${hi>0?'<div class="divider"></div>':''}
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <span style="font-size:16px">${h.emoji}</span>
        <span style="font-weight:500;font-size:13px">${h.name}</span>
        <span style="font-size:11px;color:var(--color-text-secondary);margin-left:auto">${tlbl(h.type)}</span>
      </div>
      <div class="dots">${dots}</div>`;
  }).join('');
}

(async()=>{
  await loadState();
  curDay=todayStr();
  renderHabits();
  renderToday();
})();
</script>
